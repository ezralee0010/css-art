<style>
  * {
    box-sizing: border-box;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }

  .frame {
    position: relative;
    width: 500px;
    height: 500px;
    border: 1px dashed;
  }

  .coffeemaker1 {
    width: 280px;
    height: 280px;
    background: red;
    clip-path: polygon(14% 13%, 24% 23%, 26% 88%, 17% 84%);
  }

  .coffeemaker1::after {
    content: "";
    position: absolute;
    display: block;
    width: 280px;
    height: 280px;
    background: red;
    clip-path: polygon(14% 13%, 35% 14%, 37% 76%, 17% 76%);
    transform: translate(25px, -250px);
  }

  .coffeemaker3 {
    position: absolute;
    left: 0px;
    background: gray;
    width: 500px;
    height: 500px;
    clip-path: polygon(37% 63%, 57% 63%, 63% 91%, 29% 91%);
    transform: translate(-140px, -600px);
  }

  .coffee {
    display: block;
    width: 280px;
    height: 280px;
    background: yellow;
    clip-path: ellipse(27% 10% at 48% 33%);
    transform: translate(100px, -550px);
  }

  .coffee2 {
    display: block;
    width: 280px;
    height: 280px;
    background: yellow;
    clip-path: inset(0 33% 28% 10%);
    transform: translate(126px, -732px);
  }
</style>


<div class="frame">
  <div class="coffeemaker1"></div>
  <div class="coffeemaker2"></div>
  <div class="coffeemaker3"></div>
  <div class="coffee"></div>
  <div class="coffee2"></div>
</div>
